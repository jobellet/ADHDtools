name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  # Timezone safety: the app stores local dates (habit logs, calendar cells, export
  # filenames). These jobs run the unit tests under timezones on both sides of UTC
  # so a toISOString()/new Date('YYYY-MM-DD') regression cannot slip through.
  test-timezones:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [America/New_York, Asia/Tokyo, Pacific/Kiritimati]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run tests in ${{ matrix.tz }}
        run: TZ=${{ matrix.tz }} npm test

  # MCP server: the AI-assistant bridge must keep speaking valid JSON-RPC and the
  # tool schemas must stay in sync with the app (tests/mcp-coverage.test.js).
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/mcp.test.js tests/mcp-coverage.test.js tests/assistant-ops.test.js

  # Opens the real app in headless Chromium at phone and desktop sizes
  # (tests/ui/). Catches layout and scheduling bugs that unit tests miss.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  # The three apps run the same web files. `test` checks they stay aligned
  # (tests/native-alignment.test.js); these two jobs check each native shell still builds.
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleRelease
        working-directory: android
      - name: Prepare APK
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/release/*.apk dist-android/ADHD-Tools.apk
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ADHD-Tools-Android-APK
          path: dist-android/ADHD-Tools.apk
          if-no-files-found: ignore
      - name: Publish Latest Release APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Android Release
          body: "Latest automated Android build. Download ADHD-Tools.apk directly to your phone."
          files: dist-android/ADHD-Tools.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: node scripts/prepare-desktop.cjs
      - run: cargo check --locked
        working-directory: src-tauri
