// Android app: a WebView that runs the same web files as GitHub Pages and the desktop app,
// plus native alarms, notifications and Google sign-in (see android/AGENTS.md).
import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
}

def webRoot = rootProject.projectDir.parentFile
// One list of web files for every app: scripts/web-assets.json (also read by scripts/prepare-desktop.cjs).
def webAssets = new JsonSlurper().parse(new File(webRoot, 'scripts/web-assets.json'))
// One version for every app: package.json (tests/native-alignment.test.js checks the desktop app uses it too).
def appVersion = new JsonSlurper().parse(new File(webRoot, 'package.json')).version
def generatedAssets = layout.buildDirectory.dir('generated/web-assets')

tasks.register('copyWebAssets', Sync) {
    from(webRoot) {
        webAssets.each { name -> include(name, "${name}/**") }
        exclude '**/AGENTS.md', '**/.DS_Store'
    }
    into generatedAssets
}

// Build stamp: build-info.json = { commit, date, app } of the commit this APK is built from, for
// Settings → App updates (features/settings/update-check.js). The desktop app writes the same file in
// scripts/prepare-desktop.cjs. Runs on every build; without git there is no stamp and the check stays hidden.
def buildInfoAssets = layout.buildDirectory.dir('generated/build-info')

tasks.register('writeBuildInfo') {
    def outDir = buildInfoAssets.get().asFile
    outputs.dir outDir
    outputs.upToDateWhen { false }
    doLast {
        outDir.deleteDir()
        outDir.mkdirs()
        try {
            def git = ['git', '-C', webRoot.path, 'log', '-1', '--format=%H%n%cI'].execute()
            def lines = git.text.readLines()
            if (git.waitFor() == 0 && lines.size() >= 2) {
                new File(outDir, 'build-info.json').text = JsonOutput.toJson([commit: lines[0], date: lines[1], app: 'android']) + '\n'
            }
        } catch (IOException ignored) {
            logger.warn('git not found: no build-info.json, the update check will stay hidden')
        }
    }
}

// Release signing key, kept outside the repository (created by scripts/build-android.cjs).
// The same key must sign every update, or Android refuses to install it over the old app.
def signingFile = new File(System.getenv('ADHD_ANDROID_SIGNING')
        ?: "${System.getProperty('user.home')}/.config/adhd-tools-android/signing.properties")
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace 'com.adhdtools.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.adhdtools.app'
        minSdk 26
        targetSdk 35
        // Minutes since 1970: every build can be installed over the previous one.
        versionCode((int) (System.currentTimeMillis() / 60000L))
        versionName appVersion
    }

    signingConfigs {
        release {
            if (signing.storeFile) {
                storeFile new File(signing.storeFile)
                storePassword signing.storePassword
                keyAlias signing.keyAlias
                keyPassword signing.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signing.storeFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += [generatedAssets, buildInfoAssets]
    }
}

tasks.named('preBuild') { dependsOn 'copyWebAssets', 'writeBuildInfo' }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
